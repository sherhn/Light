name: Release

# Push a tag `vX.Y.Z` (the version in Cargo.toml) to publish a GitHub release.
# `vX.Y.Z-rc1` makes a pre-release. A manual run can publish after every platform passes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, windows, linux, macos]
        default: all
      release_tag:
        description: Release tag (for example v0.2.0-rc7)
        type: string
        default: ""
      publish:
        description: Publish the verified packages as a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-15", "macos-15-intel"]' || inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["windows-latest", "ubuntu-22.04", "macos-15", "macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      LIGHT_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      LIGHT_RELEASE_PLATFORM: ${{ inputs.platform || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [[ "$LIGHT_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo "::error::invalid release tag"; exit 1; }
          tag="${LIGHT_RELEASE_TAG#v}"
          [ "${tag%%-*}" = "$version" ] || { echo "::error::tag $LIGHT_RELEASE_TAG does not match version $version in Cargo.toml"; exit 1; }
          [ "$LIGHT_RELEASE_PLATFORM" = all ] || { echo "::error::publishing requires all platforms"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev dpkg-dev desktop-file-utils
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis 7zip -y --no-progress
      - name: Install SBCL (bundled into the installer)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get install -y sbcl ;;
            macOS) brew install sbcl ;;
            Windows) choco install sbcl --version=2.6.9 -y ;;
          esac
      - name: Prepare the reviewed runtime and its exact sources
        run: python tools/legal_sources.py prepare-sbcl
      - name: Packaging tests
        run: python -m unittest discover -s tools -p test_installers.py
      - name: License and corresponding-source tests
        run: python -m unittest discover -s tools -p test_licenses.py
      - name: Check the reviewed dependency notices
        run: python tools/license_bundle.py check
      - name: Rust regression tests with the bundled runtime
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --no-fail-fast --locked
      - name: Build installers and portable archives
        run: python tools/package.py --installers
      - name: Verify legal material in the portable archives and source kit
        run: python tools/verify_archives.py target/dist
      # Hosted Windows runners expose OpenGL 1.1. Install a software driver only
      # on the test machine, after packaging, so the real GUI smoke test can run.
      - name: Software OpenGL for the Windows GUI smoke test
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f # v2
        with:
          version: '26.0.3'
      - name: Verify installation and bundled tools
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) python tools/verify_install.py target/dist/*-Setup.exe ;;
            macOS) python tools/verify_install.py target/dist/*.dmg ;;
            Linux)
              sudo apt-get install -y ./target/dist/*.deb
              python tools/verify_install.py target/dist/*.deb
              light-cli help
              sudo apt-get remove -y light-ide
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: light-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
            target/dist/*-Setup.exe
            target/dist/*.dmg
            target/dist/*.deb
            target/dist/*.sha256
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LIGHT_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Installer download instructions
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY' > RELEASE_NOTES.md
          import os
          from pathlib import Path
          from urllib.parse import quote
          base = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{quote(os.environ['LIGHT_RELEASE_TAG'])}"
          print("Download **one installer for your system**. You do not need Rust, a source checkout, or individual files from this repository.\n")
          for pattern, label in [('*-Setup.exe', 'Windows x64'), ('*macos-arm64.dmg', 'macOS: Apple Silicon'), ('*macos-x64.dmg', 'macOS: Intel'), ('*.deb', 'Ubuntu / Debian x64')]:
              for path in sorted(Path('dist').glob(pattern)):
                  print(f"- **{label}**: [{path.name}]({base}/{quote(path.name)})")
          print("\nWindows: run Setup. macOS: open the disk image and drag Light to Applications. Ubuntu / Debian: open the .deb in your software installer, or use `sudo apt install ./Light-*.deb`.\n")
          print("The IDE, CLI, offline language modules and bundled runtime are included; Windows also includes Git. Project-specific compilers and interpreters are separate tools.\n")
          for path in sorted(Path('dist').glob('Git-*-sources.zip')):
              print(f"Corresponding source for bundled Git and its components: [{path.name}]({base}/{quote(path.name)}). The kit contains exact versions, original source packages, build recipes, patches and checksums.\n")
          print("Original third-party licenses accompany every package; MPL component sources and SBCL sources are also included in the installed resources.\n")
          print("These builds do not yet have a Windows publisher signature or Apple notarization. macOS may require approval in System Settings > Privacy & Security. Portable archives are also attached for users who prefer them.")
          PY
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--generate-notes)
          [[ "$LIGHT_RELEASE_TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$LIGHT_RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "Light ${LIGHT_RELEASE_TAG#v}" --notes-file RELEASE_NOTES.md "${flags[@]}"
