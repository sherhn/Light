name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer safety tests
        run: python -m unittest discover -s tools -p test_installers.py
      - name: License and source-package regression tests
        run: python -m unittest discover -s tools -p test_licenses.py
      - name: Reviewed notices cover the locked dependencies
        run: python tools/license_bundle.py check
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - name: Install SBCL (enables the live-REPL tests)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get install -y sbcl ;;
            macOS) brew install sbcl ;;
            Windows) choco install sbcl -y ;;
          esac
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --no-fail-fast --locked
      - run: cargo build --release --workspace --locked
      - name: Node.js for language-module tests
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Software OpenGL for GUI tests
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f
        with: { version: '26.0.3' }
      - name: GUI regression tests
        if: runner.os == 'Windows'
        run: python tests/run_e2e.py --release
