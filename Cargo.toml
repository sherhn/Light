[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "1.5.3"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
lisp-syntax = { path = "crates/lisp-syntax" }
ide-core = { path = "crates/ide-core" }
light-lang = { path = "crates/light-lang" }
light-markup = { path = "crates/light-markup" }
lisp-runtime = { path = "crates/lisp-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
dirs = "7"
# the SQL console of the IDE runs on SQLite, bundled (public domain) so a project database opens out of the box
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
